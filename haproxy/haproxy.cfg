global
    maxconn 4000
    log stdout format raw local0 info

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    log     global
    mode    tcp
    retries 3
    timeout connect 4s
    timeout client  30m
    timeout server  30m
    timeout check   3s
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Read/write: only the node whose Patroni API says it is the primary
listen primary
    bind *:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    server pg-1 pg-1:5432 maxconn 1000 check port 8008
    server pg-2 pg-2:5432 maxconn 1000 check port 8008
    server pg-3 pg-3:5432 maxconn 1000 check port 8008

# Read-only: healthy replicas lagging less than 10 MB, round-robin
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk OPTIONS /replica?lag=10MB
    http-check expect status 200
    server pg-1 pg-1:5432 maxconn 1000 check port 8008
    server pg-2 pg-2:5432 maxconn 1000 check port 8008
    server pg-3 pg-3:5432 maxconn 1000 check port 8008

