# ─────────────────────────────────────────────────────────────────────────────
#  Postgres HA cluster for Docker Compose
#  3× etcd (consensus) · 3× Postgres 17 + Patroni + pgvector
#  HAProxy (rw / ro routing) · PgBouncer (pooler) · pgAdmin
#
#  Endpoints (host):
#    5000  → primary (read/write)          via HAProxy
#    5001  → replicas (read-only, balanced) via HAProxy
#    6432  → PgBouncer  (db "<APP_DB>" = rw, "<APP_DB>_ro" = ro)
#    7000  → HAProxy stats page
#    5050  → pgAdmin
# ─────────────────────────────────────────────────────────────────────────────
name: pg-ha

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  restart: unless-stopped
  networks: [pgnet]
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 10s
    timeout: 5s
    retries: 5

x-etcd-env: &etcd-env
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: pg-ha-etcd
  ETCD_DATA_DIR: /etcd-data
  ETCD_AUTO_COMPACTION_RETENTION: "1"

x-pg: &pg
  build: ./patroni
  image: pg-ha/postgres-patroni:17
  restart: unless-stopped
  networks: [pgnet]
  shm_size: 256mb
  stop_grace_period: 60s
  depends_on:
    etcd-1: { condition: service_healthy }
    etcd-2: { condition: service_healthy }
    etcd-3: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 60s

x-pg-env: &pg-env
  PATRONI_SCOPE: ${CLUSTER_NAME:-pg-ha}
  PATRONI_ETCD3_HOSTS: "'etcd-1:2379','etcd-2:2379','etcd-3:2379'"
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set in .env}
  PATRONI_REWIND_USERNAME: rewind_user
  PATRONI_REWIND_PASSWORD: ${REWIND_PASSWORD:?set in .env}
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?set in .env}
  APP_DB: ${APP_DB:-appdb}
  APP_USER: ${APP_USER:-app}
  APP_PASSWORD: ${APP_PASSWORD:?set in .env}

services:
  # ── Consensus store (leader election) ─────────────────────────────────────
  etcd-1:
    <<: *etcd
    hostname: etcd-1
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
    volumes: [etcd1:/etcd-data]

  etcd-2:
    <<: *etcd
    hostname: etcd-2
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
    volumes: [etcd2:/etcd-data]

  etcd-3:
    <<: *etcd
    hostname: etcd-3
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
    volumes: [etcd3:/etcd-data]

  # ── Postgres nodes (one becomes primary, the others stream as replicas) ──
  pg-1:
    <<: *pg
    hostname: pg-1
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
    volumes: [pg1:/var/lib/postgresql/data]

  pg-2:
    <<: *pg
    hostname: pg-2
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
    volumes: [pg2:/var/lib/postgresql/data]

  pg-3:
    <<: *pg
    hostname: pg-3
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-3:5432
    volumes: [pg3:/var/lib/postgresql/data]

  # ── Router: always points 5000 at the current primary, 5001 at replicas ──
  haproxy:
    image: haproxy:2.9-alpine
    restart: unless-stopped
    networks: [pgnet]
    depends_on: [pg-1, pg-2, pg-3]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5000:5000"
      - "${BIND_ADDR:-127.0.0.1}:5001:5001"
      - "${BIND_ADDR:-127.0.0.1}:7000:7000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  # ── Connection pooler ─────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    networks: [pgnet]
    depends_on: [haproxy]
    entrypoint: ["/bin/sh", "/opt/pgbouncer/entrypoint.sh"]
    environment:
      APP_DB: ${APP_DB:-appdb}
      APP_USER: ${APP_USER:-app}
      APP_PASSWORD: ${APP_PASSWORD:?set in .env}
      POOL_MODE: ${POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${DEFAULT_POOL_SIZE:-40}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6432:6432"
    volumes:
      - ./pgbouncer/entrypoint.sh:/opt/pgbouncer/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Admin UI ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks: [pgnet]
    depends_on: [haproxy]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin

networks:
  pgnet:
    driver: bridge

volumes:
  etcd1:
  etcd2:
  etcd3:
  pg1:
  pg2:
  pg3:
  pgadmin:
